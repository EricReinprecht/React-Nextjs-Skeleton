services:
    database:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: skeleton
            POSTGRES_USER: skeleton
            POSTGRES_PASSWORD: skeleton-local-password
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U skeleton -d skeleton']
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build:
            context: .
            target: dev
        env_file:
            - .env.local
        develop:
            watch:
                # Sync source code changes live (triggers HMR without rebuilding image)
                - action: sync
                  path: ./src
                  target: /app/src
                # Sync public directory for static assets
                - action: sync
                  path: ./public
                  target: /app/public
                # Re-run prisma generate if schema changes
                - action: sync+restart
                  path: ./prisma
                  target: /app/prisma
                # Rebuild container image when dependencies change
                - action: rebuild
                  path: package.json
                - action: rebuild
                  path: package-lock.json
        command: sh -c "npx prisma generate && npx prisma db push && npx tsx src/server/scripts/auto-seed.ts && npm run dev"
        volumes:
            # Keep node_modules internal so host OS doesn't overwrite container modules
            - /app/node_modules
            - /app/.next
        environment:
            DATABASE_URL: postgresql://skeleton:skeleton-local-password@database:5432/skeleton?schema=public
            WATCHPACK_POLLING: 'true'
            FAST_REFRESH: 'true'
        ports:
            - '3001:3000'

volumes:
    postgres_data:
