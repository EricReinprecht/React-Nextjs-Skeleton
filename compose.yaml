services:
    database:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: skeleton
            POSTGRES_USER: skeleton
            POSTGRES_PASSWORD: skeleton-local-password
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U skeleton -d skeleton']
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build:
            target: dev
        command: sh -c "npx prisma generate && npm run dev"
        volumes:
            - .:/app
            - /app/node_modules
            - /app/.next
        environment:
            DATABASE_URL: postgresql://skeleton:skeleton-local-password@database:5432/skeleton?schema=public
            WATCHPACK_POLLING: 'true'
        ports:
            - '3001:3000'

volumes:
    postgres_data:

secrets:
    env_local:
        file: .env.local
